<h2>LOGIN FORM</h2>
  <form action = "signup.php" method = "POST" >
    <table bgcolor = "" width ="30%">
<tr> <th colspan="2"> <h3 > COMPLETE USER REGISTRATION FORM</h3></th></tr>

<tr><td>User Role</td>
    <td><select id="role" name="role" required>
        <option value="">Select Role</option>
        <option value="community member">Community Member</option>
        <option value="administrator">Administrator</option>
        <option value="ward councillor">Ward Councillor</option>
        <option value="municipal staff">Municipal Staff</option>
        
    </select></td></tr>
<tr><td>First Name</td><td> <input type = "text" name="firstname" maxlength="35" size="20" value="" required> </td></tr> 
<tr><td>Last Name </td><td> <input type = "text" name="surname" maxlength="35" size="20" value="" required> </td></tr> 

<tr><td> Email Adress</td><td> <input type="email" name="email" maxlength="35" size="20"></td></tr>



<tr><td>Password</td><td> <input type = "text" name="pword" maxlength="35" size="20" value="" required> </td></tr> 

<tr><td>Ward</td>
    <td><select id="ward" name="ward" required>
        <option value="">Select Ward</option>
        <option value="Ward 1">Ward 1</option>
        <option value="Ward 2">Ward 2</option>
        <option value="Ward 3">Ward 3</option>
        <option value="Ward 4">Ward 4</option>
        <option value="Ward 5">Ward 5</option>
        <option value="Ward 6">Ward 6</option>
        <option value="Ward 7">Ward 7</option>
        <option value="Ward 8">Ward 8</option>
        <option value="Ward 9">Ward 9</option>
        <option value="Ward 10">Ward 10</option>
        <option value="Ward 11">Ward 11</option>
        <option value="Ward 12">Ward 12</option>
        <option value="Ward 13">Ward 13</option>
        <option value="Ward 14">Ward 14</option>
 </select></td>
 </tr><tr>
<td>Physical Address</td> <td><textarea rows="4" cols="20" name="address"></textarea></td> </tr>


<tr><td><input type="submit" value="   Create User   "></td><td><input type="reset" value="   Clear Form   "></td></tr>
</table>
