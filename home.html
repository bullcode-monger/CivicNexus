<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Modern Landing Page</title>
    
</head>
<body>
    <nav class="navbar">
        <div class="logo">BrandName</div>

            <li><a href="#">Features</a></li>
